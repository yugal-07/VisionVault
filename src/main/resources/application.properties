# VisionVault Application Properties
spring.application.name=VisionVault

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:file:./data/visionvault
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Custom Application Properties
visionvault.upload-dir=uploads
visionvault.thumbnail-dir=thumbnails

# Server Configuration
server.port=8080
